<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="Pictures/Logo - Yellow With No Background.png">
  <title>Contact — Wither To Nothing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="home.html">
        <img class="header-title-logo" src="Pictures/Wither To Nothing TITLE WHITE PNG.png" alt="Wither To Nothing">
      </a>
      <nav class="tabs">
        <a href="home.html">Home</a>
        <a href="releases.html">Releases</a>
        <a href="events.html">Events</a>
        <a href="merch.html">Merch</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="page-heading">Contact</h1>
    <hr class="heading-rule">

    <div class="contact-block">
      <p class="lead" style="margin-bottom: 1.5rem;">
        Bookings, press, merch enquiries or just want to say hi &mdash; reach out below.
      </p>

      <form class="contact-form" action="mailto:daniel.woodward@gmail.com" method="post" enctype="text/plain">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button class="btn" type="submit" style="align-self: center;">Send Message</button>
      </form>

      <div class="socials">
        <a href="https://www.youtube.com/watch?v=WGv_8_bei9A" target="_blank" rel="noopener">YouTube</a>
        <a href="#" target="_blank" rel="noopener">Instagram</a>
        <a href="#" target="_blank" rel="noopener">Spotify</a>
      </div>
    </div>
  </main>

  <footer>
    <img class="footer-logo" src="Pictures/Logo - Yellow With No Background.png" alt="">
    &copy; 2026 Wither To Nothing. All rights reserved.
  </footer>
</body>
</html>
