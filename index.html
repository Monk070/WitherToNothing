<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="Pictures/Logo - Yellow With No Background.png">
  <title>Wither To Nothing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .landing-gif {
      max-width: 90vw;
      max-height: 70vh;
      object-fit: contain;
    }

    .follow-link {
      color: #f2a71b;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5em;
      font-size: 1.15rem;
      padding: 1rem 2.5rem 1rem 3rem; /* extra left padding balances letter-spacing */
      border: 1px solid rgba(242, 167, 27, 0.5);
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease,
                  box-shadow 0.3s ease;
      animation: pulse 3s ease-in-out infinite;
    }

    .follow-link:hover {
      background: #f2a71b;
      color: #000;
      border-color: #f2a71b;
      box-shadow: 0 0 35px rgba(242, 167, 27, 0.45);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 8px rgba(242, 167, 27, 0.15); }
      50%      { box-shadow: 0 0 28px rgba(242, 167, 27, 0.4); }
    }
  </style>
</head>
<body>
  <img class="landing-gif" src="Pictures/Wither To Nothing GIF.gif" alt="Wither To Nothing">
  <a class="follow-link" href="/home">Follow The Signs</a>
</body>
</html>
